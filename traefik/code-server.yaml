apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-ingress
spec:
  rules:
    - host: code-server.gpg123.vip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
spec:
  type: ExternalName
  ## 域名,或者 直接能用ip和端口直接访问的
  externalName: server.gpg123.vip
  ports:
    - port: 8080
