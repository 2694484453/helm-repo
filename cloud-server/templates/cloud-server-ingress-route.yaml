# ingressroute.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cloud-server-ingress-route
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cloud-server-k8s.gpg123.vip`)
      kind: Rule
      services:
        - name: cloud-server
          port: 9099
  tls:
    certResolver: le  # 引用 Let's Encrypt 解析器[9](@ref)
    domains:
      - main: "gpg123.vip"
        sans:
          - "*.gpg123.vip"  # 支持泛域名