apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cs-for-java-service
  namespace: {{ .Values.namespace }}
spec:
 ports:
   - name: {{ .Release.Name }}-cs-for-java-service
     port: 80
     targetPort: {{ .Values.codeServer.containerPort }}
 selector:
   service: {{ .Release.Name }}-cs-for-java