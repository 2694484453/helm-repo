kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-pvc
  namespace: ide
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{.Values.codeServer.resources.storage}}
  storageClassName: nfs
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-token
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: nfs
  resources:
    requests:
      storage: 5Mi
