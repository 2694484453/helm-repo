apiVersion: apps/v1
kind: Deployment
metadata:
  name: hoppscotch-backend
  labels:
    app: hoppscotch-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hoppscotch-backend
  template:
    metadata:
      name: hoppscotch-backend
      labels:
        app: hoppscotch-backend
    spec:
      restartPolicy: Always
      containers:
        - name: hoppscotch-backend
          image: hoppscotch/hoppscotch-backend:latest
          imagePullPolicy: IfNotPresent

{{/*          command:*/}}
{{/*            - /bin/sh*/}}
{{/*            - -c*/}}
{{/*            - sleep 9999*/}}
          # pnpx prisma migrate deploy
          ports:
            - containerPort: 8888
              name: backend
              protocol: TCP
            - containerPort: 3100
              name: admin
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgresql://hoppscotch:hoppscotch@ecs.gpg123.vip:5432/hoppscotch
{{/*            - name: DATABASE_URL*/}}
{{/*              value: postgresql://postgres:hoppscotch@default.postgresql.svc.cluster.local:5432/hoppscotch  */}}
