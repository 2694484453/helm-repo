apiVersion: v1
kind: Service
metadata:
  name: ecs-node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
  annotations:
    prometheus.io/scrape: 'true'
spec:
  ports:
    - protocol: TCP
      port: 19100
      targetPort: 19100
      name: ecs-metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ecs-node-exporter
  namespace: monitoring
subsets:
  - addresses:
      - ip: 47.97.162.27
    ports:
      - port: 19100
        protocol: TCP
        name: ecs-metrics
