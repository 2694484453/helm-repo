apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aggregated-trace-metrics
  namespace: monitoring
  labels:
    app.kubernetes.io/name: aggregated-trace-metrics
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: aggregated-trace-metrics
  endpoints:
    - port: aggregated-trace-metrics
      path: /metrics
      interval: 15s
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-metrics-svc
  namespace: monitoring
  labels:
    app.kubernetes.io/name: aggregated-trace-metrics
spec:
  clusterIP: None
  ports:
    - name: aggregated-trace-metrics
      port: 8889
      protocol: TCP
      targetPort: 8889
