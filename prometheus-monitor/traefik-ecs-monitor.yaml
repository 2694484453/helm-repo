apiVersion: v1
kind: Service
metadata:
  name: traefik-ecs
  namespace: monitoring
  labels:
    kubernetes.io/service-name: traefik-ecs
  annotations:
    prometheus.io/scrape: 'true'
spec:
  ports:
    - port: 9100
      protocol: TCP
      name: traefik
---
apiVersion: v1
kind: Endpoints
metadata:
  name: traefik-ecs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: traefik-ecs
subsets:
  - addresses:
      - ip: 47.97.162.27
    ports:
      - port: 9100
        protocol: TCP
        name: traefik
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik-ecs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: traefik-ecs
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:            # Service选择器
      app.kubernetes.io/name: traefik-ecs
  namespaceSelector:        # Namespace选择器
    matchNames:
      - monitoring
  endpoints:
    - port: metrics           # 采集节点端口（svc定义）
      interval: 10s           # 采集频率根据实际需求配置，prometheus默认15s
      path: /actuator/prometheus          # 默认地址/metrics

