apiVersion: v1
kind: Service
metadata:
  name: traefik-ecs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: traefik-ecs
spec:
  type: ExternalName
  externalName: ecs.gpg123.vip
  ports:
    - port: 9100
      name: traefik
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik-ecs-monitor
  namespace: monitoring
  labels:
    app.kubernetes.io/name: traefik-ecs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-ecs
  endpoints:
    - port: traefik
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - monitoring
