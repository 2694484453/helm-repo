apiVersion: v1
kind: Service
metadata:
  name: tcs-node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
  annotations:
    prometheus.io/scrape: 'true'
spec:
  ports:
    - protocol: TCP
      port: 9100
      targetPort: 9100
      name: tcs-metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: tcs-node-exporter
  namespace: monitoring
subsets:
  - addresses:
      - ip: 124.221.2.29
    ports:
      - port: 9100
        protocol: TCP
        name: tcs-metrics
