apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  annotations:
    prometheus.io/scrape: 'true'
spec:
  ports:
    - protocol: TCP
      port: 18888
      targetPort: 18888
      name: metrics
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jaeger
  namespace: monitoring
subsets:
  - addresses:
      - ip: 124.221.2.29
    ports:
      - port: 18888
        protocol: TCP
        name: metrics

