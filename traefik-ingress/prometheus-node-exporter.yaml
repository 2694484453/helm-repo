apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-node-exporter-ingress
  namespace: monitoring
spec:
  rules:
    - host: node-exporter.gpg123.vip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-prometheus-node-exporter
                port:
                  name: metrics

